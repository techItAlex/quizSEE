<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="quizSEE, a transparent quiz monitor for Google Forms">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2438c9" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="m"><rect width="1280" height="420" fill="url(#fade)"/></mask>
  </defs>
  <rect width="1280" height="420" fill="#f2f4f9"/>
  <rect width="1280" height="420" fill="url(#grid)" mask="url(#m)"/>

  <!-- mark -->
  <g transform="translate(96 92) scale(2.5)">
    <rect width="32" height="32" rx="7" fill="#2438c9"/>
    <ellipse cx="16" cy="16" rx="11.8" ry="7" fill="#fff"/>
    <circle cx="16" cy="16" r="4.8" fill="#12172b"/>
    <circle cx="14.5" cy="14.5" r="1.45" fill="#ffd83d"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="200" y="152" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="84" letter-spacing="-3" fill="#12172b">quizSEE</text>
  <text x="98" y="236" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="34" letter-spacing="-0.5" fill="#12172b">A transparent quiz monitor for Google Forms.</text>
  <text x="98" y="278" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" fill="#4a5170">See how the quiz was taken. Students know what is recorded. Answers never are.</text>

  <!-- timeline strip -->
  <g transform="translate(98 322)">
    <rect width="1084" height="48" rx="10" fill="#eef0f7"/>
    <rect x="0" y="0" width="290" height="48" rx="10" fill="#e4e8f8"/>
    <rect x="290" y="0" width="380" height="48" fill="#eef0f7"/>
    <rect x="670" y="0" width="414" height="48" rx="10" fill="#e4e8f8"/>
    <text x="12" y="38" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#4a5170">P1</text>
    <text x="302" y="38" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#4a5170">P2</text>
    <text x="682" y="38" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#4a5170">P3</text>
    <rect x="344" y="10" width="66" height="28" rx="4" fill="#ffd83d" stroke="#12172b" stroke-width="1.5"/>
    <rect x="790" y="10" width="40" height="28" rx="4" fill="#ffd83d" stroke="#12172b" stroke-width="1.5"/>
    <rect x="958" y="10" width="24" height="28" rx="4" fill="#ffd83d" stroke="#12172b" stroke-width="1.5"/>
    <circle cx="150" cy="9" r="5" fill="#fff" stroke="#12172b" stroke-width="2"/>
    <circle cx="470" cy="9" r="5" fill="#2438c9" stroke="#2438c9" stroke-width="2"/>
    <circle cx="520" cy="9" r="5" fill="#2438c9" stroke="#2438c9" stroke-width="2"/>
  </g>

  <!-- chips -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="14">
    <rect x="900" y="104" width="282" height="36" rx="18" fill="#ddf3ea"/><circle cx="920" cy="122" r="5" fill="#0b7a55"/>
    <text x="934" y="127" fill="#0b7a55">Chrome extension, Manifest V3</text>
    <rect x="900" y="150" width="282" height="36" rx="18" fill="#e8ebfc"/><circle cx="920" cy="168" r="5" fill="#1a2a9c"/>
    <text x="934" y="173" fill="#1a2a9c">Firebase, no SDK, no build step</text>
    <rect x="900" y="196" width="282" height="36" rx="18" fill="#fff6cc"/><circle cx="920" cy="214" r="5" fill="#8a5300"/>
    <text x="934" y="219" fill="#8a5300">Explainable, rule-based scoring</text>
  </g>
</svg>
